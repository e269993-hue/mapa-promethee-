<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de ranking PROMETHEE II – São Paulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef1ee;--panel:#fbfcfa;--ink:#17231f;--mute:#5d6b65;--line:#d5dcd7;--acc:#0b6e66;--acc2:#e9f3f1;--sea:#dfe8e6;--none:#c9cfcb;--warn:#8a5a00;--warnbg:#fdf3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--panel:#17211e;--ink:#e6eeea;--mute:#9aaca5;--line:#2b3a36;--acc:#4cc2b6;--acc2:#1c2f2c;--sea:#121b19;--none:#3a4642;--warn:#f0c46a;--warnbg:#2f2610}}
:root[data-theme="dark"]{--bg:#0f1715;--panel:#17211e;--ink:#e6eeea;--mute:#9aaca5;--line:#2b3a36;--acc:#4cc2b6;--acc2:#1c2f2c;--sea:#121b19;--none:#3a4642;--warn:#f0c46a;--warnbg:#2f2610}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:372px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
h1{font-size:19px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:22px 0 8px}
.sub{color:var(--mute);margin:0 0 12px;font-size:13px}
.note{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12.5px}
.crit{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.crit.off{opacity:.55}
.crit .top{display:flex;align-items:center;gap:8px}
.crit label.n{flex:1;font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer}
.pct{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700;min-width:44px;text-align:right}
.crit input[type=range]{width:100%;margin:8px 0 2px;accent-color:var(--acc)}
.dir{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dir button{border:0;background:transparent;color:var(--mute);padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
.dir button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b,select,input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button.b{cursor:pointer}button.b:hover{border-color:var(--acc)}
input[type=search]{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 10px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--acc);font-weight:600}
ol.top{margin:0;padding:0;list-style:none}
ol.top li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer}
ol.top li:hover,ol.top li:focus-visible{background:var(--acc2)}
ol.top .r{width:26px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
ol.top .m{flex:1}ol.top .p{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12.5px}
.det{border:1px solid var(--acc);border-radius:8px;padding:12px;background:var(--acc2)}
.det h3{margin:0;font-size:16px}.det .reg{color:var(--mute);font-size:12.5px;margin-bottom:8px}
.det table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.det td{padding:2px 0}.det td:last-child{text-align:right}
.big{display:flex;gap:18px;margin:6px 0 8px}.big div span{display:block;color:var(--mute);font-size:12px}.big div b{font-size:20px}
main{position:relative;background:var(--sea);min-width:0;min-height:0}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map path{stroke:var(--panel);stroke-width:.6;vector-effect:non-scaling-stroke}
svg#map path:hover{stroke:var(--ink);stroke-width:1.6}
svg#map path.sel{stroke:var(--ink);stroke-width:2.4}
.legend{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:min(300px,calc(100% - 100px))}
.legend b{font-size:12.5px;display:block;margin-bottom:6px}
.bar{height:10px;border-radius:5px}
.lab{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.q{display:flex;gap:2px}.q i{flex:1;height:10px}
.zoom{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:6px;font-size:12.5px;opacity:0;z-index:9;max-width:230px;line-height:1.35}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:30px;pointer-events:none}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:56vh 1fr;height:auto;min-height:100%}
main{order:-1;height:56vh}aside{border-right:0;border-top:1px solid var(--line);overflow:visible}html,body{height:auto}}
@media (prefers-reduced-motion:no-preference){svg#map path{transition:fill .25s}}

.drop{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;border:2px dashed var(--acc);border-radius:10px;padding:16px 12px;background:var(--acc2);cursor:pointer;margin-top:10px}
.drop:hover,.drop.on{background:var(--panel)}.drop b{color:var(--acc);font-size:15px}.drop span{color:var(--mute);font-size:12.5px}
#status{margin:10px 0 0}#status details{margin-top:4px;font-size:12.5px;color:var(--mute)}#status summary{cursor:pointer}
.grp{display:flex;gap:8px;align-items:center;font-weight:700;margin:14px 0 6px;font-size:12.5px;color:var(--acc);cursor:pointer}
#msg{display:flex}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Mapa de ranking PROMETHEE II</h1>
  <p class="sub">Envie a planilha Excel dos indicadores, escolha os critérios e os pesos e veja o ranking dos municípios de São Paulo no mapa.</p>

  <label class="drop" id="drop" for="file">
    <b>Enviar planilha</b>
    <span>Clique ou arraste um arquivo .xlsx, .xls ou .csv</span>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  </label>
  <div id="status" class="sub" role="status"></div>
  <button class="b" id="demo" style="margin-top:6px">Ver exemplo com dados simulados</button>

  <div id="panel" hidden>
    <h2>Critérios</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="b" id="all">Marcar todos</button>
      <button class="b" id="none">Limpar</button>
      <button class="b" id="eq">Pesos iguais</button>
      <button class="b" id="sheetw" hidden>Pesos da planilha</button>
    </div>
    <div id="crits"></div>

    <h2>Exibição</h2>
    <div class="row">
      <div class="seg" id="mode" role="group" aria-label="Modo de cor">
        <button data-m="cont" aria-pressed="true">Φ contínuo</button>
        <button data-m="quint" aria-pressed="false">Quintis</button>
      </div>
      <select id="pal" aria-label="Paleta de cores">
        <option value="YlGnBu">Amarelo-verde-azul</option>
        <option value="YlOrRd">Amarelo-vermelho</option>
        <option value="Viridis">Viridis</option>
        <option value="Magma">Magma</option>
      </select>
    </div>

    <h2>Município</h2>
    <input type="search" id="q" list="dl" placeholder="Buscar município…" aria-label="Buscar município">
    <datalist id="dl"></datalist>
    <div id="det" style="margin-top:10px"></div>

    <h2>10 melhores colocados</h2>
    <ol class="top" id="top"></ol>

    <h2>Exportar</h2>
    <button class="b" id="dl-csv">Baixar ranking (CSV)</button>
  </div>
</aside>
<main>
  <svg id="map" role="img" aria-label="Mapa coroplético dos municípios de São Paulo"></svg>
  <div id="msg">Envie a planilha Excel para ver o ranking no mapa.</div>
  <div class="zoom"><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button><button id="zr" aria-label="Ver estado todo" style="font-size:13px">⌂</button></div>
  <div class="legend" id="legend" hidden></div>
</main>
</div>
<div id="tip"></div>

    const anyG=r.crit.some(c=>c.group);
    setDataset(r.crit,r.vals,r.crit.map(c=>anyG?!!c.group:true));
    let s=`<b>${esc(f.name)}</b>${sheets.length>1?` (aba ${esc(used)})`:""}<br>${r.hit} de ${M} municípios reconhecidos, ${r.crit.length} colunas de indicadores.`;
    if(r.unmatched.length)s+=`<details><summary>${r.unmatched.length} nomes da planilha sem correspondência</summary>${esc(r.unmatched.slice(0,40).join("; "))}</details>`;
    if(r.missing.length)s+=`<details><summary>${r.missing.length} municípios do mapa sem dados</summary>${esc(r.missing.slice(0,60).join("; "))}</details>`;
    $("#status").innerHTML=s;
  }catch(err){const m=err.message||String(err);$("#status").innerHTML=`<span style="color:var(--warn)">${esc(m)}</span>`;if(!CRIT.length){$("#msg").style.display="flex";$("#msg").textContent="Erro ao ler a planilha: "+m;}}
}
function setDataset(crit,vals,sel){
  CRIT=crit;V=ids.map(id=>vals.get(id)||null);cache={};selId=null;$("#det").innerHTML="";
  state=CRIT.map((c,k)=>({sel:sel[k],w:50,dir:"max"}));
  $("#sheetw").hidden=!CRIT.some(c=>c.w0!=null);
  $("#panel").hidden=false;$("#legend").hidden=false;drawCrits();update();
  $("#dl").innerHTML=ids.map(id=>INFO[id].n).sort((a,b)=>a.localeCompare(b,"pt-BR")).map(n=>`<option value="${esc(n)}">`).join("");
}
$("#file").onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value="";};
["dragover","dragenter"].forEach(t=>addEventListener(t,e=>{e.preventDefault();$("#drop").classList.add("on");}));
["dragleave","drop"].forEach(t=>addEventListener(t,e=>{e.preventDefault();$("#drop").classList.remove("on");}));
addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f);});
$("#demo").onclick=()=>{
  const names=["Densidade Empresarial","Tecido Empresarial","Articulação","Gestão Pública"];
  setDataset(names.map(n=>({name:n,group:null,w0:null})),new Map(ids.map(id=>[id,DEMO[id]])),[true,true,true,false]);
  $("#status").innerHTML="<div class='note'>Exemplo com indicadores simulados (números aleatórios). O ranking não tem significado real.</div>";
};
// ---------- PROMETHEE II ----------
function flow(k){ // fluxo líquido do critério (critério usual, maximizar), só entre municípios com dado
  if(cache[k])return cache[k];
  const v=V.map(r=>r?r[k]:NaN),f=new Float64Array(M).fill(NaN),ok=[];
  v.forEach((x,i)=>{if(Number.isFinite(x))ok.push(i);});
  const n=ok.length;
  for(const i of ok){let s=0;const a=v[i];for(const j of ok){const b=v[j];if(a>b)s++;else if(a<b)s--;}f[i]=n>1?s/(n-1):0;}
  return cache[k]=f;
}
function compute(){
  const act=state.map((s,k)=>s.sel&&s.w>0?k:-1).filter(k=>k>=0),tot=act.reduce((a,k)=>a+state[k].w,0);
  if(!act.length){phi=[];rank=[];nV=0;return false;}
  phi=new Array(M).fill(0);
  act.forEach(k=>{const f=flow(k),w=state[k].w/tot,sg=state[k].dir==="max"?1:-1;for(let i=0;i<M;i++)phi[i]+=w*sg*f[i];});
  const valid=[];phi.forEach((p,i)=>{if(Number.isFinite(p))valid.push(p);});
  nV=valid.length;valid.sort((a,b)=>b-a);
  rank=phi.map(p=>{if(!Number.isFinite(p))return NaN;let lo=0,hi=nV;while(lo<hi){const m=(lo+hi)>>1;if(valid[m]>p+1e-12)lo=m+1;else hi=m;}return lo+1;});
  return nV>0;
}
// ---------- mapa ----------
const svg=d3.select("#map"),g=svg.append("g");
let proj,path,zoom;
function size(){const r=$("#map").getBoundingClientRect();return[r.width||800,r.height||600];}
const paths=g.selectAll("path").data(GEO.features).join("path").style("fill","var(--none)")
  .on("mousemove",(e,d)=>tip(e,d)).on("mouseleave",()=>$("#tip").style.opacity=0)
  .on("click",(e,d)=>{e.stopPropagation();select(d.properties.c,false);});
function layout(){const[w,h]=size();svg.attr("viewBox",`0 0 ${w} ${h}`);proj=d3.geoMercator().fitExtent([[12,12],[w-12,h-12]],GEO);path=d3.geoPath(proj);paths.attr("d",path);}
zoom=d3.zoom().scaleExtent([1,40]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom).on("dblclick.zoom",null);
function zoomTo(id){const f=GEO.features.find(x=>x.properties.c===id);if(!f)return;const[[x0,y0],[x1,y1]]=path.bounds(f),[w,h]=size(),k=Math.min(14,.5/Math.max((x1-x0)/w,(y1-y0)/h));
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(w/2,h/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2));}
$("#zi").onclick=()=>svg.transition().call(zoom.scaleBy,1.6);
$("#zo").onclick=()=>svg.transition().call(zoom.scaleBy,1/1.6);
$("#zr").onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
function color(i){
  if(!phi.length||!Number.isFinite(phi[i]))return"var(--none)";
  const I=interp[pal];
  if(mode==="quint"){const q=Math.min(4,Math.floor((rank[i]-1)/nV*5));return I(1-(q+.5)/5);}
  const f=phi.filter(Number.isFinite),mn=d3.min(f),mx=d3.max(f);return I(mx>mn?(phi[i]-mn)/(mx-mn):.5);
}
function legend(){
  const I=interp[pal],L=$("#legend");if(!phi.length){L.innerHTML="";return;}
  if(mode==="quint")L.innerHTML=`<b>Faixas do ranking (quintis)</b><div class="q">${[0,1,2,3,4].map(q=>`<i style="background:${I(1-(q+.5)/5)}"></i>`).join("")}</div><div class="lab"><span>Melhores</span><span>Piores</span></div>`;
  else{const f=phi.filter(Number.isFinite);L.innerHTML=`<b>Fluxo líquido PROMETHEE II (Φ)</b><div class="bar" style="background:linear-gradient(90deg,${d3.range(0,1.01,.1).map(t=>I(t)).join(",")})"></div><div class="lab"><span>${fmt(d3.min(f),3)}</span><span>${fmt(d3.max(f),3)}</span></div>`;}
}
// ---------- critérios ----------
function drawCrits(){
  const tot=state.reduce((a,s)=>a+(s.sel?s.w:0),0),groups=[];
  CRIT.forEach((c,k)=>{const gn=c.group||(CRIT.some(x=>x.group)?"Demais colunas":"");let G=groups.find(x=>x.n===gn);if(!G)groups.push(G={n:gn,ks:[]});G.ks.push(k);});
  $("#crits").innerHTML=groups.map((G,gi)=>{
    const allOn=G.ks.every(k=>state[k].sel);
    const head=G.n?`<label class="grp"><input type="checkbox" data-g="${gi}" ${allOn?"checked":""}>${esc(G.n)}</label>`:"";
    return head+G.ks.map(k=>{const s=state[k],p=s.sel&&tot>0?s.w/tot*100:0,n=esc(CRIT[k].name);
      return`<div class="crit ${s.sel?"":"off"}"><div class="top"><label class="n"><input type="checkbox" data-k="${k}" ${s.sel?"checked":""}>${n}</label>
      <div class="dir" role="group" aria-label="Direção de ${n}"><button data-k="${k}" data-d="max" aria-pressed="${s.dir==="max"}">Maior</button><button data-k="${k}" data-d="min" aria-pressed="${s.dir==="min"}">Menor</button></div>
      <span class="pct" id="pc${k}">${fmt(p,0)}%</span></div>
      <input type="range" min="0" max="100" value="${s.w}" data-k="${k}" ${s.sel?"":"disabled"} aria-label="Peso de ${n}"></div>`}).join("");
  }).join("");
  $("#crits")._groups=groups;
}
function refreshPct(){const tot=state.reduce((a,s)=>a+(s.sel?s.w:0),0);state.forEach((s,k)=>{const e=$("#pc"+k);if(e)e.textContent=fmt(s.sel&&tot>0?s.w/tot*100:0,0)+"%";});}
$("#crits").addEventListener("input",e=>{const t=e.target;if(t.type==="range"){state[+t.dataset.k].w=+t.value;refreshPct();update();}});
$("#crits").addEventListener("change",e=>{const t=e.target;if(t.type!=="checkbox")return;
  if(t.dataset.g!==undefined)$("#crits")._groups[+t.dataset.g].ks.forEach(k=>state[k].sel=t.checked);else state[+t.dataset.k].sel=t.checked;
  drawCrits();update();});
$("#crits").addEventListener("click",e=>{const t=e.target.closest("button[data-d]");if(t){state[+t.dataset.k].dir=t.dataset.d;drawCrits();update();}});
$("#all").onclick=()=>{state.forEach(s=>s.sel=true);drawCrits();update();};
$("#none").onclick=()=>{state.forEach(s=>s.sel=false);drawCrits();update();};
$("#eq").onclick=()=>{state.forEach(s=>s.w=50);drawCrits();update();};
$("#sheetw").onclick=()=>{state.forEach((s,k)=>{if(CRIT[k].w0!=null)s.w=Math.round(CRIT[k].w0*100);});drawCrits();update();};
$("#mode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;[...$("#mode").children].forEach(x=>x.setAttribute("aria-pressed",x===b));update();});
$("#pal").onchange=e=>{pal=e.target.value;update();};
// ---------- detalhes ----------
function tip(e,d){
  const i=ids.indexOf(d.properties.c),t=$("#tip"),ok=phi.length&&Number.isFinite(phi[i]);
  t.innerHTML=`<b>${esc(INFO[ids[i]].n)}</b>`+(ok?`<br>Posição: ${rank[i]}º de ${nV}<br>Φ = ${fmt(phi[i])}`:V[i]?"":"<br>Sem dados");
  t.style.opacity=1;t.style.left=Math.min(e.clientX+14,innerWidth-240)+"px";t.style.top=(e.clientY+14)+"px";
}
function select(id,zoomIt){
  selId=id;paths.classed("sel",d=>d.properties.c===id);paths.filter(d=>d.properties.c===id).raise();
  const i=ids.indexOf(id),d=INFO[id];if(i<0)return;
  const ok=phi.length&&Number.isFinite(phi[i]);
  const rows=V[i]?CRIT.map((n,k)=>state[k].sel?`<tr><td>${esc(n.name)}</td><td>${Number.isFinite(V[i][k])?fmt(V[i][k],3):"–"}</td></tr>`:"").join(""):"";
  $("#det").innerHTML=`<div class="det"><h3>${esc(d.n)}</h3><div class="reg">${esc([d.mi,d.me].filter(Boolean).join(" · "))}</div>
  <div class="big"><div><span>Posição</span><b>${ok?rank[i]+"º":"–"}</b></div><div><span>Fluxo líquido Φ</span><b>${ok?fmt(phi[i]):"–"}</b></div></div><table>${rows}</table></div>`;
  if(zoomIt)zoomTo(id);
}
$("#q").addEventListener("change",e=>{const id=byName[norm(e.target.value)];if(id)select(id,true);});
function list(){
  const o=[...Array(M).keys()].filter(i=>Number.isFinite(phi[i])).sort((a,b)=>rank[a]-rank[b]).slice(0,10);
  $("#top").innerHTML=o.length?o.map(i=>`<li tabindex="0" data-id="${ids[i]}"><span class="r">${rank[i]}º</span><span class="m">${esc(INFO[ids[i]].n)}</span><span class="p">${fmt(phi[i],3)}</span></li>`).join(""):"<li style='cursor:default;color:var(--mute)'>Sem critérios ativos.</li>";
}
$("#top").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(li)select(li.dataset.id,true);});
$("#top").addEventListener("keydown",e=>{if(e.key==="Enter"){const li=e.target.closest("li[data-id]");if(li)select(li.dataset.id,true);}});
function update(){
  const ok=compute();$("#msg").style.display=ok?"none":"flex";
  $("#msg").textContent=CRIT.length?"Selecione ao menos um critério com peso maior que zero.":"Envie a planilha Excel para ver o ranking no mapa.";
  paths.style("fill",(d,n)=>color(n));legend();list();if(selId)select(selId,false);
}
$("#dl-csv").onclick=()=>{
  if(!phi.length)return;const act=CRIT.map((n,k)=>k).filter(k=>state[k].sel);
  const rows=[["Município","codarea","Ranking","Phi",...act.map(k=>CRIT[k].name)]];
  [...Array(M).keys()].filter(i=>Number.isFinite(phi[i])).sort((a,b)=>rank[a]-rank[b]).forEach(i=>rows.push([INFO[ids[i]].n,ids[i],rank[i],phi[i].toFixed(6),...act.map(k=>V[i][k])]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="ranking_promethee.csv";a.click();
};
layout();update();
let rt;const rl=()=>{clearTimeout(rt);rt=setTimeout(layout,100);};addEventListener("resize",rl);if(window.ResizeObserver)new ResizeObserver(rl).observe($("main"));
</script>
